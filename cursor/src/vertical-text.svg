<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:nd="https://github.com/mishan/neon-doll"
     width="24" height="24" viewBox="0 0 24 24" nd:hotspot="12 12">
  <!-- vertical-text: The I-beam on its side. -->
  <!-- A black body with a 1-unit light edge. See tools/build-cursor.py. -->
  <defs>
    <g id="s0" transform="rotate(90 12 12)">
      <polygon points="9,3 15,3 15,5 13,5 13,19 15,19 15,21 9,21 9,19 11,19 11,5 9,5"/>
    </g>
  </defs>
  <g stroke-linejoin="miter" stroke-miterlimit="1.5">
