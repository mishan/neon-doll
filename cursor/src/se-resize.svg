<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:nd="https://github.com/mishan/neon-doll"
     width="24" height="24" viewBox="0 0 24 24" nd:hotspot="13.5 13.5">
  <!-- se-resize: An arrow into the bottom right corner. -->
  <!-- A black body with a 1-unit light edge. See tools/build-cursor.py. -->
  <defs>
    <g id="s0" transform="rotate(180 12 12)">
      <polygon points="5,5 14,5 14,7 7,7 7,14 5,14"/>
      <polygon points="0,0 4,4 1,4 1,12 -1,12 -1,4 -4,4" transform="translate(10 10) rotate(-45)"/>
    </g>
  </defs>
  <g stroke-linejoin="miter" stroke-miterlimit="1.5">
    <use xlink:href="#s0" fill="none" stroke="#f7f4fa" stroke-width="2"/>
    <use xlink:href="#s0" fill="#0f0d14"/>
  </g>
</svg>
