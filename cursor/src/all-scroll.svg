<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:nd="https://github.com/mishan/neon-doll"
     width="24" height="24" viewBox="0 0 24 24" nd:hotspot="12 12">
  <!-- all-scroll: Four arrowheads around a block: the block is the site's
       prompt cursor, the point you scroll from. -->
  <!-- Every shape is drawn three times: a light outer edge, a dark
       inner edge, then the fuchsia body. See tools/build-cursor.py. -->
  <defs>
    <g id="s0">
      <polygon points="12,3 16,7 8,7"/>
      <polygon points="12,21 8,17 16,17"/>
      <polygon points="3,12 7,8 7,16"/>
      <polygon points="21,12 17,16 17,8"/>
      <rect x="10" y="10" width="4" height="4"/>
    </g>
  </defs>
  <g stroke-linejoin="miter" stroke-miterlimit="1.5">
    <use xlink:href="#s0" fill="none" stroke="#f7f4fa" stroke-width="4"/>
    <use xlink:href="#s0" fill="none" stroke="#0f0d14" stroke-width="2"/>
    <use xlink:href="#s0" fill="#ff2d95"/>
  </g>
</svg>
