<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:nd="https://github.com/mishan/neon-doll"
     width="24" height="24" viewBox="0 0 24 24" nd:hotspot="10 10">
  <!-- zoom-in: A magnifier with a plus. Hotspot: the lens center. -->
  <!-- Every shape is drawn three times: a light outer edge, a dark
       inner edge, then the fuchsia body. See tools/build-cursor.py. -->
  <defs>
    <g id="s0">
      <circle cx="10" cy="10" r="6"/>
      <rect x="8.5" y="15" width="3" height="7.5" transform="rotate(-45 10 10)"/>
    </g>
  </defs>
  <g stroke-linejoin="miter" stroke-miterlimit="1.5">
    <use xlink:href="#s0" fill="none" stroke="#f7f4fa" stroke-width="4"/>
    <use xlink:href="#s0" fill="none" stroke="#0f0d14" stroke-width="2"/>
    <use xlink:href="#s0" fill="#ff2d95"/>
  </g>
  <g fill="#0f0d14">
    <rect x="7" y="9" width="6" height="2"/>
    <rect x="9" y="7" width="2" height="6"/>
  </g>
</svg>
