<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:nd="https://github.com/mishan/neon-doll"
     width="24" height="24" viewBox="0 0 24 24" nd:hotspot="3 2">
  <!-- no-drop: The arrow with a small no-entry disc. -->
  <!-- A black body with a 1-unit light edge. See tools/build-cursor.py. -->
  <defs>
    <g id="s0">
      <polygon points="3,2 3,18 7,14 10,20 12.5,19 9.5,13 14,13"/>
    </g>
    <g id="s1">
      <circle cx="18.5" cy="17.5" r="3.5"/>
    </g>
  </defs>
  <g stroke-linejoin="miter" stroke-miterlimit="1.5">
    <use xlink:href="#s0" fill="none" stroke="#f7f4fa" stroke-width="2"/>
    <use xlink:href="#s0" fill="#0f0d14"/>
    <use xlink:href="#s1" fill="none" stroke="#f7f4fa" stroke-width="2"/>
