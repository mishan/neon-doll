<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:nd="https://github.com/mishan/neon-doll"
     width="24" height="24" viewBox="0 0 24 24" nd:hotspot="8.5 2">
  <!-- pointer: A blocky hand, index finger up. Hotspot: the fingertip. -->
  <!-- An everyday pointer: a black body with a 1-unit fuchsia edge and a
       faint fuchsia halo past it. See tools/build-cursor.py. -->
  <defs>
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0"
            width="24" height="24" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.75"/>
    </filter>
    <g id="s0">
      <rect x="7" y="2" width="3" height="12"/>
      <rect x="11" y="8" width="2" height="6"/>
      <rect x="14" y="9" width="2" height="5"/>
      <rect x="17" y="10" width="2" height="5"/>
      <rect x="7" y="12" width="12" height="9"/>
      <polygon points="3,11 5,11 8,14 8,18 6,18 3,15"/>
    </g>
  </defs>
  <g stroke-linejoin="miter" stroke-miterlimit="1.5">
    <g filter="url(#halo)" opacity="0.6">
      <use xlink:href="#s0" fill="#ff2d95" stroke="#ff2d95" stroke-width="3"/>
    </g>
    <use xlink:href="#s0" fill="none" stroke="#ff2d95" stroke-width="2"/>
    <use xlink:href="#s0" fill="#0f0d14"/>
  </g>
</svg>
