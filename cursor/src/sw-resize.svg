<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:nd="https://github.com/mishan/neon-doll"
     width="24" height="24" viewBox="0 0 24 24" nd:hotspot="10 13.5">
  <!-- sw-resize: An arrow into the bottom left corner. -->
  <!-- Every shape is drawn three times: a light outer edge, a dark
       inner edge, then the fuchsia body. See tools/build-cursor.py. -->
  <defs>
    <g id="s0" transform="matrix(1 0 0 -1 0 24)">
      <polygon points="5,5 14,5 14,7 7,7 7,14 5,14"/>
      <polygon points="0,0 4,4 1,4 1,12 -1,12 -1,4 -4,4" transform="translate(10 10) rotate(-45)"/>
    </g>
  </defs>
  <g stroke-linejoin="miter" stroke-miterlimit="1.5">
    <use xlink:href="#s0" fill="none" stroke="#f7f4fa" stroke-width="4"/>
    <use xlink:href="#s0" fill="none" stroke="#0f0d14" stroke-width="2"/>
    <use xlink:href="#s0" fill="#ff2d95"/>
  </g>
</svg>
